
# Nombre del microservicio
spring.application.name=pacientes-service

# Puerto del microservicio
server.port=8081

# Configuracion de Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Conexion a PostgreSQL mediante R2DBC
spring.r2dbc.url=r2dbc:postgresql://localhost:5432/hospital_vida_salud
spring.r2dbc.username=hospital_user
spring.r2dbc.password=${DB_PASSWORD}

# Registro de consultas R2DBC
logging.level.org.springframework.r2dbc=DEBUG
