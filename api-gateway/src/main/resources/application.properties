
# Nombre del Gateway
spring.application.name=api-gateway

# Puerto principal
server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Ruta al microservicio Pacientes
spring.cloud.gateway.server.webflux.routes[0].id=pacientes
spring.cloud.gateway.server.webflux.routes[0].uri=lb://PACIENTES-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/pacientes,/api/pacientes/**

# Ruta al microservicio Citas
spring.cloud.gateway.server.webflux.routes[1].id=citas
spring.cloud.gateway.server.webflux.routes[1].uri=lb://CITAS-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/citas,/api/citas/**
